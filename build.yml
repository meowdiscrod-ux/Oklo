name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Prepare project
        run: |
          echo "Files in repo:"
          find . -not -path './.git/*' -type f | head -50
          if [ -f build.gradle ] && [ -f libs/meow-original.jar ]; then
            echo "Using unzipped project at repo root"
            mkdir -p proj
            cp -r build.gradle settings.gradle gradle.properties src libs proj/
          else
            Z=$(find . -iname '*meow-liquid*.zip' -not -path './.git/*' | head -1)
            if [ -z "$Z" ]; then
              echo "No meow-liquid*.zip (and no unzipped project) found in the repo"
              exit 1
            fi
            echo "Using $Z"
            mkdir -p proj
            unzip -o -q "$Z" -d proj
          fi

      - name: Build jar
        shell: bash
        working-directory: proj
        run: set -o pipefail; gradle meowJar --no-daemon 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: grep -n -A4 'error:' proj/build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: proj/build/libs/meow-client-liquid.jar
