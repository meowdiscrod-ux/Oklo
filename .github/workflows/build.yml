name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel older runs of the same branch/PR so only the newest one builds.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        shell: bash
        run: |
          set -euo pipefail
          for f in build.gradle settings.gradle gradle.properties libs/meow-original.jar \
                   src/main/java/cc/mochi/MeowMenu.java \
                   src/main/java/cc/mochi/meowgui/MeowGuiScreen.java \
                   src/main/java/cc/mochi/meowgui/Gfx.java \
                   src/main/java/cc/mochi/meowgui/KeyNames.java; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f (upload the whole folder, including libs/)"
              exit 1
            fi
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build jar
        run: gradle meowJar --no-daemon --stacktrace

      - name: Verify jar contents
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/meow-client-meow.jar
          test -s "$JAR" || { echo "::error::$JAR was not produced"; exit 1; }
          unzip -tq "$JAR"
          unzip -Z1 "$JAR" > jar-files.txt

          # new GUI classes must be inside
          grep -qx 'cc/mochi/meowgui/MeowGuiScreen.class' jar-files.txt \
            || { echo "::error::MeowGuiScreen.class missing from jar"; exit 1; }
          grep -qx 'cc/mochi/MeowMenu.class' jar-files.txt \
            || { echo "::error::MeowMenu.class missing from jar"; exit 1; }

          # the original mod metadata and entrypoint must still be there
          grep -qx 'fabric.mod.json' jar-files.txt \
            || { echo "::error::fabric.mod.json missing from jar"; exit 1; }
          grep -qx 'cc/mochi/MochiClient.class' jar-files.txt \
            || { echo "::error::MochiClient.class missing from jar"; exit 1; }

          # the MeowMenu in the jar must be the NEW one (it references the Meow screen)
          unzip -p "$JAR" cc/mochi/MeowMenu.class | grep -aq 'MeowGuiScreen' \
            || { echo "::error::MeowMenu in the jar is still the old one"; exit 1; }

          # no signature files (they would make the merged jar fail to load)
          if grep -Eq '^META-INF/.*\.(SF|RSA|DSA)$' jar-files.txt; then
            echo "::error::Signature files found in jar"; exit 1
          fi
          echo "Jar OK: $(wc -l < jar-files.txt) entries, $(du -h "$JAR" | cut -f1)"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: build/libs/meow-client-meow.jar
          if-no-files-found: error
          retention-days: 30

  release:
    # Only when you push a tag like v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: meow-client-jar
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/meow-client-meow.jar --title "${{ github.ref_name }}" --generate-notes
