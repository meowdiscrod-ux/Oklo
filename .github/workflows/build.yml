name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the folder that holds build.gradle, even if the files were uploaded
      # into a subfolder (e.g. meow-client/) instead of the repo root.
      - name: Locate project folder
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          DIR=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/settings.gradle" ] && [ -f "$d/libs/meow-original.jar" ]; then DIR="$d"; break; fi
          done < <(find . -maxdepth 4 -name build.gradle -not -path './.git/*' | sort)

          if [ -z "$DIR" ]; then
            echo "::error::Could not find a folder with build.gradle + settings.gradle + libs/meow-original.jar"
            echo "Files in the repo (depth 3):"
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi

          for f in build.gradle settings.gradle gradle.properties libs/meow-original.jar \
                   src/main/java/cc/mochi/MeowMenu.java \
                   src/main/java/cc/mochi/meowgui/MeowGuiScreen.java \
                   src/main/java/cc/mochi/meowgui/Gfx.java \
                   src/main/java/cc/mochi/meowgui/KeyNames.java; do
            if [ ! -f "$DIR/$f" ]; then
              echo "::error::Missing required file: $DIR/$f"
              echo "Files in $DIR (depth 4):"
              find "$DIR" -maxdepth 4 -not -path '*/.git/*' | sort
              exit 1
            fi
          done
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          build-root-directory: ${{ steps.proj.outputs.dir }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle meowJar --no-daemon --stacktrace

      - name: Verify jar contents
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/meow-client-meow.jar
          test -s "$JAR" || { echo "::error::$JAR was not produced"; exit 1; }
          unzip -tq "$JAR"
          unzip -Z1 "$JAR" > "$RUNNER_TEMP/jar-files.txt"
          L="$RUNNER_TEMP/jar-files.txt"

          grep -qx 'cc/mochi/meowgui/MeowGuiScreen.class' "$L" \
            || { echo "::error::MeowGuiScreen.class missing from jar"; exit 1; }
          grep -qx 'cc/mochi/MeowMenu.class' "$L" \
            || { echo "::error::MeowMenu.class missing from jar"; exit 1; }
          grep -qx 'fabric.mod.json' "$L" \
            || { echo "::error::fabric.mod.json missing from jar"; exit 1; }
          grep -qx 'cc/mochi/MochiClient.class' "$L" \
            || { echo "::error::MochiClient.class missing from jar"; exit 1; }

          unzip -p "$JAR" cc/mochi/MeowMenu.class | grep -aq 'MeowGuiScreen' \
            || { echo "::error::MeowMenu in the jar is still the old one"; exit 1; }

          if grep -Eq '^META-INF/.*\.(SF|RSA|DSA)$' "$L"; then
            echo "::error::Signature files found in jar"; exit 1
          fi
          echo "Jar OK: $(wc -l < "$L") entries, $(du -h "$JAR" | cut -f1)"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/meow-client-meow.jar
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: meow-client-jar
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/meow-client-meow.jar --title "$TAG" --generate-notes
