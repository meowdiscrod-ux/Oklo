name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Unzip project
        run: |
          Z=$(find . -name 'meow-liquid-v2.zip' -not -path './.git/*' | head -1)
          if [ -z "$Z" ]; then
            echo "meow-liquid-v2.zip NOT FOUND in the repo"
            exit 1
          fi
          mkdir -p proj
          unzip -o -q "$Z" -d proj

      - name: Build jar
        shell: bash
        working-directory: proj
        run: gradle meowJar --no-daemon 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: grep -n -A4 'error:' proj/build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: proj/build/libs/meow-client-liquid.jar
