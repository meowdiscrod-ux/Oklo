name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Write project files
        run: |
          set -e
          mkdir -p libs src/main/java/cc/mochi/liquid src/main/resources/assets/mochi/font
          # find your original jar: inside the uploaded zip, or any jar in the repo root
          if ls meow-liquid-build*.zip >/dev/null 2>&1; then unzip -p meow-liquid-build*.zip libs/meow-original.jar > libs/meow-original.jar; fi
          if [ ! -s libs/meow-original.jar ]; then cp "$(ls *.jar | head -1)" libs/meow-original.jar; fi
          unzip -p libs/meow-original.jar assets/mochi/fonts/Inter.ttf > src/main/resources/assets/mochi/font/Inter.ttf
          ls -la libs src/main/resources/assets/mochi/font
          cat > build.gradle <<'EOF_0'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          base { archivesName = 'meow-client' }
          version = 'liquid'

          repositories { mavenCentral() }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              // your original compiled client (cc.mochi.*), used only to compile against
              modCompileOnly files('libs/meow-original.jar')
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }

          // Final jar = new Liquid GUI classes (remapped) + your original jar,
          // with the new MeowMenu replacing the old one. Everything else is kept untouched.
          tasks.register('meowJar', Jar) {
              dependsOn remapJar
              archiveFileName = 'meow-client-liquid.jar'
              destinationDirectory = layout.buildDirectory.dir('libs')
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // first source wins
              from({ zipTree(remapJar.archiveFile.get().asFile) }) {
                  exclude 'META-INF/MANIFEST.MF'
              }
              from({ zipTree('libs/meow-original.jar') }) {
                  exclude 'cc/mochi/MeowMenu.class'
              }
          }
          EOF_0
          cat > settings.gradle <<'EOF_1'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'meow-client'
          EOF_1
