name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles Gradle + Loom/Yarn/Minecraft caches between runs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build jar
        run: gradle meowJar --no-daemon --stacktrace

      - name: Check jar
        run: |
          ls -lh build/libs/meow-client-aurora.jar
          unzip -l build/libs/meow-client-aurora.jar | grep -q 'cc/mochi/MeowMenu.class'
          unzip -l build/libs/meow-client-aurora.jar | grep -q 'cc/mochi/aurora/AuroraGuiScreen.class'

      - uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: build/libs/meow-client-aurora.jar
          if-no-files-found: error

      # Tag a version (git tag v1 && git push --tags) to get a direct-download release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/libs/meow-client-aurora.jar \
            --title "Meow Client + Aurora ${{ github.ref_name }}" \
            --generate-notes
