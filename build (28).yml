name: Build Meow Client JAR

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # gradle-wrapper.jar is missing from the source, so install Gradle directly
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Find and unpack project
        run: |
          echo "== Files in repo =="
          find . -not -path './.git/*' -not -path './.github/*' | head -40
          if [ ! -f build.gradle ]; then
            find . -iname '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
              echo "Unpacking $z"
              unzip -q -o "$z" -d _unzipped
            done
            DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n1)" 2>/dev/null)
            if [ -n "$DIR" ] && [ "$DIR" != "." ]; then
              echo "Found project in $DIR, moving to root"
              cp -a "$DIR"/. .
            fi
          fi
          ls

      - name: Fix bundled libraries (orbit crash fix)
        run: |
          python3 - <<'PY'
          import json, re
          g = open('build.gradle').read()
          if "include 'meteordevelopment:orbit" not in g:
              g = g.replace("    bundledLibraries 'meteordevelopment:orbit:0.2.4'",
                "    bundledLibraries 'meteordevelopment:orbit:0.2.4'\n    include 'meteordevelopment:orbit:0.2.4'")
              g = g.replace("    bundledLibraries 'io.github.racoondog:norbit:1.2.0'",
                "    bundledLibraries 'io.github.racoondog:norbit:1.2.0'\n    include 'io.github.racoondog:norbit:1.2.0'")
          # stop copying raw jars into META-INF/jars (Loom's include does it properly)
          g = re.sub(r"    from\(configurations\.bundledLibraries\) \{\s*into 'META-INF/jars'\s*\}\n", "", g)
          open('build.gradle', 'w').write(g)
          p = 'src/main/resources/fabric.mod.json'
          m = json.load(open(p))
          m.pop('jars', None)
          json.dump(m, open(p, 'w'), indent=2)
          print(g)
          PY

      - name: Pre-check project
        run: |
          set -e
          echo "== Required files =="
          for f in build.gradle settings.gradle gradle.properties \
                   src/main/resources/fabric.mod.json \
                   src/main/resources/mochi.mixins.json \
                   src/main/java/cc/mochi/MochiClient.java; do
            test -f "$f" && echo "OK  $f" || { echo "MISSING $f"; exit 1; }
          done

          echo "== Mixin classes listed in mochi.mixins.json exist =="
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open('src/main/resources/mochi.mixins.json'))
          d = 'src/main/java/cc/mochi/mixin/'
          bad = [n for k in ('mixins', 'client', 'server') for n in m.get(k, [])
                 if not os.path.exists(d + n.split('$')[0] + '.java')]
          if bad:
              print('Missing mixin sources:', bad); sys.exit(1)
          print('All mixins found')
          PY

          echo "== Warnings (non-fatal) =="
          test -f src/main/resources/icon.png || echo "WARN: icon.png missing (fabric.mod.json references it)"

      - name: Build JAR
        run: gradle build --stacktrace --no-daemon

      - name: Verify JAR is ready
        run: |
          set -e
          JAR=$(ls build/libs/meow-client-*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          echo "Checking $JAR"
          unzip -l "$JAR" > contents.txt
          grep -q "fabric.mod.json" contents.txt
          grep -q "cc/mochi/MochiClient.class" contents.txt
          grep -q "mochi.mixins.json" contents.txt
          grep -q "META-INF/jars/.*orbit" contents.txt
          grep -q "META-INF/jars/.*norbit" contents.txt
          echo "JAR looks good"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
