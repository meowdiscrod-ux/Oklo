name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Locate project (unzips any meow-liquid*.zip if present)
        id: loc
        run: |
          z=$(ls meow-liquid*.zip 2>/dev/null | sort | tail -1)
          if [ -n "$z" ]; then
            echo "Using zip: $z"
            rm -rf _proj && mkdir _proj && unzip -q "$z" -d _proj
          fi
          if [ -d _proj ]; then root=_proj; else root=.; fi
          f=$(find "$root" -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "::error::settings.gradle not found - upload the meow-liquid zip to the repo root"; find . -maxdepth 2 -not -path './.git*' | sort; exit 1; fi
          d=$(dirname "$f"); echo "Project dir: $d"; ls -la "$d" "$d/libs"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build jar
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle meowJar --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: meow-client-jar
          path: ${{ steps.loc.outputs.dir }}/build/libs/meow-client-liquid.jar
          if-no-files-found: error
